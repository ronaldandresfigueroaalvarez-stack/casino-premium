<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Slots & Games Premium</title>
    <style>
        body {
            text-align: center;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 20px 10px;
            background-color: #12021c;
            background: radial-gradient(circle, #1a052e 0%, #0d0117 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff0055;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Marcador de Saldo Global */
        .marcador-saldo {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 25px;
        }

        /* Pestañas de Navegación */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-button {
            background: #25143a;
            border: 1px solid #4a2d6d;
            color: #bbb;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab-button.active {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 15px #00c6ff;
            border-color: #00c6ff;
        }

        /* Contenedores de cada Juego */
        .game-panel {
            display: none;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(20, 5, 35, 0.85);
            border: 2px solid #3d1b63;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .game-panel.active {
            display: block;
        }

        /* --- ESTILOS DE MAQUINITA (SLOTS) CON GIRO VERTICAL --- */
        .slot-container {
            border: 3px solid #ff0055;
            box-shadow: inset 0 0 20px rgba(255,0,85,0.5), 0 0 15px rgba(255,0,85,0.3);
            border-radius: 15px;
            padding: 20px;
            background: #090111;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .slot-window {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .slot-reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .slot-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-sizing: border-box;
        }
        @keyframes spinReel {
            0% { transform: translateY(0); }
            100% { transform: translateY(-400px); }
        }
        .spinning {
            animation: spinReel 0.15s linear infinite;
        }

        /* --- ESTILOS DE LA RULETA CON NÚMEROS TEXTUALES --- */
        .wheel-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 25px auto;
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0055;
            z-index: 10;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #fff;
            position: relative;
            overflow: hidden;
            background: conic-gradient(
                #ff3366 0deg 60deg,
                #33cc66 60deg 120deg,
                #3366ff 120deg 180deg,
                #ffcc33 180deg 240deg,
                #ff9933 240deg 300deg,
                #9933ff 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .wheel-label {
            position: absolute;
            width: 100px;
            height: 40px;
            left: calc(50% - 50px);
            top: 10px;
            transform-origin: center 130px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
        }
        .label1 { transform: rotate(30deg); }
        .label2 { transform: rotate(90deg); }
        .label3 { transform: rotate(150deg); }
        .label4 { transform: rotate(210deg); }
        .label5 { transform: rotate(270deg); }
        .label6 { transform: rotate(330deg); }

        /* --- ESTILOS DE MINAS --- */
        .grid-minas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }
        .mine-tile {
            aspect-ratio: 1;
            background: #2a163d;
            border: 2px solid #4a2b6d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mine-tile:hover {
            background: #391e54;
            border-color: #00ffcc;
        }
        .mine-tile.revealed {
            background: #11051c;
            border-color: #222;
            cursor: default;
        }

        /* Botones de Acción Generales */
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ff0055 0%, #d6004b 100%);
            border: none;
            color: white;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: all 0.2s;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-spin {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
            color: #000;
        }
        .btn-safe {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 15px;
            min-height: 20px;
            color: #ffcc00;
        }

        .cajero-box {
            margin-top: 25px;
            border-top: 1px solid #2d1744;
            padding-top: 20px;
            display: flex;
            gap: 15px;
        }
        .btn-cajero {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-deposit { background: #28a745; color: white; }
        .btn-withdraw { background: #dc3545; color: white; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <h1>CASINO PREMIUM</h1>

    <div class="marcador-saldo">SALDO: $<span id="displaySaldo">10.00</span></div>

    <div class="tabs">
        <button id="tabSlots" class="tab-button active" onclick="cambiarJuego('slots')">🎰 Maquinita</button>
        <button id="tabRuleta" class="tab-button" onclick="cambiarJuego('ruleta')">🎡 Ruleta</button>
        <button id="tabMinas" class="tab-button" onclick="cambiarJuego('minas')">💣 Minas</button>
    </div>

    <div id="panel-slots" class="game-panel active">
        <div class="slot-container">
            <div class="row">
                <div class="slot-window"><div id="reel1" class="slot-reel"><div class="slot-icon">🍒</div></div></div>
                <div class="slot-window"><div id="reel2" class="slot-reel"><div class="slot-icon">👑</div></div></div>
                <div class="slot-window"><div id="reel3" class="slot-reel"><div class="slot-icon">💎</div></div></div>
            </div>
        </div>
        <button id="btnApostarSlots" class="btn-action">APOSTAR ($1)</button>
        <div id="mensajeSlots" class="status-msg">¡Prueba tu suerte en los slots!</div>
    </div>

    <div id="panel-ruleta" class="game-panel">
        <div class="wheel-box">
            <div class="pointer"></div>
            <div id="wheel" class="wheel">
                <div class="wheel-label label1"><span>x2</span><span>💰</span></div>
                <div class="wheel-label label2"><span>0</span><span>💀</span></div>
                <div class="wheel-label label3"><span>x1.5</span><span>💵</span></div>
                <div class="wheel-label label4"><span>x0.5</span><span>✨</span></div>
                <div class="wheel-label label5"><span>JACKPOT</span><span>🚀</span></div>
                <div class="wheel-label label6"><span>x1</span><span>👍</span></div>
            </div>
        </div>
        <button id="btnGirarRuleta" class="btn-action btn-spin">GIRAR RULETA ($1)</button>
        <div id="mensajeRuleta" class="status-msg">¡Prueba tu suerte!</div>
    </div>

    <div id="panel-minas" class="game-panel">
        <div id="tablero" class="grid-minas"></div>
        <button id="btnIniciarMinas" class="btn-action">INICIAR JUEGO ($1)</button>
        <button id="btnRetirarMinas" class="btn-action btn-safe" style="display:none;">RETIRAR GANANCIAS</button>
        <div id="mensajeMinas" class="status-msg">Configuración: 3 Minas ocultas.</div>
    </div>

    <div style="max-width:400px; margin:0 auto;">
        <div class="cajero-box">
            <button class="btn-cajero btn-deposit" onclick="depositarSimulado()">💰 DEPOSITAR</button>
            <button class="btn-cajero btn-withdraw" onclick="retirarSimulado()">💵 RETIRAR</button>
        </div>
    </div>

    <audio id="sndApostar" src="sonidos/apostar.mp3" preload="auto"></audio>
    <audio id="sndPremio" src="sonidos/premio.mp3" preload="auto"></audio>
    <audio id="sndPerder" src="sonidos/perder.mp3" preload="auto"></audio>
    <audio id="sndRuleta" src="sonidos/ruleta.mp3" preload="auto"></audio>

    <script>
        // VARIABLES GLOBALES Y AUDIOS
        let saldoActual = 10.00;
        const displaySaldo = document.getElementById('displaySaldo');

        const sndApostar = document.getElementById('sndApostar');
        const sndPremio = document.getElementById('sndPremio');
        const sndPerder = document.getElementById('sndPerder');
        const sndRuleta = document.getElementById('sndRuleta');

        // FUNCIÓN DE PAPELITOS CAYENDO (CONFETTI)
        function lanzarPapelitos() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function reproducirSonido(audioNode) {
            if (audioNode) {
                audioNode.currentTime = 0;
                audioNode.play().catch(e => console.log("Interacción requerida para audio"));
            }
        }

        function cambiarJuego(juego) {
            document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            if(juego === 'slots') {
                document.getElementById('panel-slots').classList.add('active');
                document.getElementById('tabSlots').classList.add('active');
            } else if(juego === 'ruleta') {
                document.getElementById('panel-ruleta').classList.add('active');
                document.getElementById('tabRuleta').classList.add('active');
            } else if(juego === 'minas') {
                document.getElementById('panel-minas').classList.add('active');
                document.getElementById('tabMinas').classList.add('active');
                crearTableroInicial();
            }
        }

        function depositarSimulado() {
            saldoActual += 10.00;
            displaySaldo.textContent = saldoActual.toFixed(2);
            reproducirSonido(sndPremio);
        }

        function retirarSimulado() {
            if(saldoActual > 0) {
                alert(`Retiro exitoso: Se procesaron $${saldoActual.toFixed(2)}`);
                saldoActual = 0;
                displaySaldo.textContent = saldoActual.toFixed(2);
                reproducirSonido(sndPerder);
            }
        }

        // --- LÓGICA DE MAQUINITA ---
        const iconos = ['🍒', '🍋', '🍉', '💎', '👑', '⭐'];
        const btnApostarSlots = document.getElementById('btnApostarSlots');
        const mensajeSlots = document.getElementById('mensajeSlots');

        if(btnApostarSlots) {
            btnApostarSlots.addEventListener('click', () => {
                if (saldoActual < 1.00) { mensajeSlots.textContent = "❌ Saldo insuficiente."; return; }
                
                saldoActual -= 1.00;
                displaySaldo.textContent = saldoActual.toFixed(2);
                mensajeSlots.textContent = "🎰 Girando rodillos...";
                reproducirSonido(sndApostar);

                const r1 = document.getElementById('reel1');
                const r2 = document.getElementById('reel2');
                const r3 = document.getElementById('reel3');

                [r1, r2, r3].forEach(reel => {
                    reel.innerHTML = '';
                    for(let i=0; i<6; i++) {
                        const iconDiv = document.createElement('div');
                        iconDiv.classList.add('slot-icon');
                        iconDiv.textContent = iconos[Math.floor(Math.random() * iconos.length)];
                        reel.appendChild(iconDiv);
                    }
                    reel.classList.add('spinning');
                });

                let finalIcons = [];
                setTimeout(() => { r1.classList.remove('spinning'); finalIcons[0] = r1.children[0].textContent; }, 1000);
                setTimeout(() => { r2.classList.remove('spinning'); finalIcons[1] = r2.children[0].textContent; }, 1400);
                setTimeout(() => {
                    r3.classList.remove('spinning');
                    finalIcons[2] = r3.children[0].textContent;
                    evaluarResultadoSlots(finalIcons[0], finalIcons[1], finalIcons[2]);
                }, 1800);
            });
        }

        function evaluarResultadoSlots(a, b, c) {
            if (a === b && b === c) {
                let premio = 5.00;
                if(a === '💎' || a === '👑') premio = 10.00;
                saldoActual += premio;
                mensajeSlots.textContent = `🎉 ¡TRIPLE! Ganaste $${premio.toFixed(2)}`;
                reproducirSonido(sndPremio);
                lanzarPapelitos(); // PAPELITOS AL GANAR EL TRIPLE
            } else if (a === b || b === c || a === c) {
                saldoActual += 1.50;
                mensajeSlots.textContent = "✨ ¡Doble! Recuperas y ganas $1.50";
                reproducirSonido(sndPremio);
            } else {
                mensajeSlots.textContent = "❌ Suerte para la próxima.";
                reproducirSonido(sndPerder);
            }
            displaySaldo.textContent = saldoActual.toFixed(2);
        }

        // --- LÓGICA DE LA RULETA ---
        const wheel = document.getElementById('wheel');
        const btnGirarRuleta = document.getElementById('btnGirarRuleta');
        const mensajeRuleta = document.getElementById('mensajeRuleta');
        let gradosActuales = 0;

        if(btnGirarRuleta) {
            btnGirarRuleta.addEventListener('click', () => {
                if (saldoActual < 1.00) { mensajeRuleta.textContent = "❌ Saldo insuficiente."; return; }
                
                saldoActual -= 1.00;
                displaySaldo.textContent = saldoActual.toFixed(2);
                mensajeRuleta.textContent = "🎡 La ruleta está girando...";
                reproducirSonido(sndRuleta);

                const vueltasExtra = Math.floor(Math.random() * 360) + 1440; 
                gradosActuales += vueltasExtra;
                wheel.style.transform = `rotate(${gradosActuales}deg)`;

                setTimeout(() => {
                    const anguloFinal = (360 - (gradosActuales % 360)) % 360;
                    
                    if (anguloFinal >= 0 && anguloFinal < 60) {
                        saldoActual += 2.00;
                        mensajeRuleta.textContent = "💰 ¡Multiplicador x2! Ganaste $2.00";
                        reproducirSonido(sndPremio);
                    } else if (anguloFinal >= 60 && anguloFinal < 120) {
                        saldoActual += 1.00;
                        mensajeRuleta.textContent = "👍 ¡Empate! Recuperas tu $1.00";
                        reproducirSonido(sndPremio);
                    } else if (anguloFinal >= 120 && anguloFinal < 180) {
                        saldoActual += 5.00;
                        mensajeRuleta.textContent = "🚀 ¡JACKPOT! Ganaste $5.00";
                        reproducirSonido(sndPremio);
                        lanzarPapelitos(); // PAPELITOS EN EL JACKPOT
                    } else if (anguloFinal >= 180 && anguloFinal < 240) {
                        saldoActual += 0.50;
                        mensajeRuleta.textContent = "✨ ¡Devolución parcial! Recibes $0.50";
                        reproducirSonido(sndPremio);
                    } else if (anguloFinal >= 240 && anguloFinal < 300) {
                        saldoActual += 1.50;
                        mensajeRuleta.textContent = "💵 ¡Premio menor! Ganaste $1.50";
                        reproducirSonido(sndPremio);
                    } else {
                        mensajeRuleta.textContent = "💀 ¡Mala suerte! Sector vacío (x0)";
                        reproducirSonido(sndPerder);
                    }
                    displaySaldo.textContent = saldoActual.toFixed(2);
                }, 4000);
            });
        }

        // --- LÓGICA DE MINAS ---
        const tablero = document.getElementById('tablero');
        const btnIniciarMinas = document.getElementById('btnIniciarMinas');
        const btnRetirarMinas = document.getElementById('btnRetirarMinas');
        const mensajeMinas = document.getElementById('mensajeMinas');
        let minasMapa = [];
        let juegoMinasActivo = false;
        let diamantesEncontrados = 0;
        let pozoMinas = 0;

        function crearTableroInicial() {
            if(!tablero) return;
            tablero.innerHTML = '';
            for(let i=0; i<16; i++) {
                const tile = document.createElement('div');
                tile.classList.add('mine-tile');
                tablero.appendChild(tile);
            }
        }

        function crearTablero() {
            if(!tablero) return;
            tablero.innerHTML = '';
            for(let i=0; i<16; i++) {
                const tile = document.createElement('div');
                tile.classList.add('mine-tile');
                tile.dataset.index = i;
                tile.addEventListener('click', tocarCasilla);
                tablero.appendChild(tile);
            }
        }

        if(btnIniciarMinas) {
            btnIniciarMinas.addEventListener('click', () => {
                if (juegoMinasActivo) return;
                if (saldoActual < 1.00) { mensajeMinas.textContent = "❌ Saldo insuficiente."; return; }
                
                saldoActual -= 1.00; 
                displaySaldo.textContent = saldoActual.toFixed(2);
                reproducirSonido(sndApostar);
                
                juegoMinasActivo = true;
                diamantesEncontrados = 0;
                pozoMinas = 1.00;
                mensajeMinas.textContent = "💎 ¡Juego Iniciado! Pozo actual: $1.00";
                btnIniciarMinas.style.display = 'none';
                btnRetirarMinas.style.display = 'block';
                
                minasMapa = Array(16).fill('💎');
                let colocadas = 0;
                while(colocadas < 3) {
                    let idx = Math.floor(Math.random() * 16);
                    if(minasMapa[idx] === '💎') { minasMapa[idx] = '💣'; colocadas++; }
                }
                crearTablero();
            });
        }

        function tocarCasilla(e) {
            if (!juegoMinasActivo) return;
            const tile = e.target;
            if (tile.classList.contains('revealed')) return;

            tile.classList.add('revealed');
            const idx = tile.dataset.index;
            tile.textContent = minasMapa[idx];

            if (minasMapa[idx] === '💣') {
                juegoMinasActivo = false;
                mensajeMinas.textContent = "💥 ¡BOOM! Tocaste una mina. Perdiste.";
                btnIniciarMinas.style.display = 'block';
                btnRetirarMinas.style.display = 'none';
                revelarTodo();
                reproducirSonido(sndPerder);
            } else {
                diamantesEncontrados++;
                pozoMinas += 0.40;
                mensajeMinas.textContent = `💎 ¡Diamante! Pozo actual: $${pozoMinas.toFixed(2)}`;
                reproducirSonido(sndPremio);
                if(diamantesEncontrados === 13) cobrarMinas();
            }
        }

        if(btnRetirarMinas) {
            btnRetirarMinas.addEventListener('click', cobrarMinas);
        }

        function cobrarMinas() {
            if(!juegoMinasActivo) return;
            juegoMinasActivo = false;
            saldoActual += pozoMinas;
            displaySaldo.textContent = saldoActual.toFixed(2);
            mensajeMinas.textContent = `💰 ¡Cobraste con éxito! Ganaste $${pozoMinas.toFixed(2)}`;
            btnIniciarMinas.style.display = 'block';
            btnRetirarMinas.style.display = 'none';
            revelarTodo();
            reproducirSonido(sndPremio);
            lanzarPapelitos(); // PAPELITOS AL RETIRARSE DE MINAS
        }

        function revelarTodo() {
            const tiles = document.querySelectorAll('.mine-tile');
            tiles.forEach(tile => {
                const idx = tile.dataset.index;
                tile.classList.add('revealed');
                tile.textContent = minasMapa[idx];
            });
        }
    </script>
</body>
</html>
