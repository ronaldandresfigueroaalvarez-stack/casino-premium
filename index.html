<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Slots & Games Premium</title>
    <style>
        body {
            text-align: center;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 20px 10px;
            background-color: #12021c;
            background: radial-gradient(circle, #1a052e 0%, #0d0117 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff0055;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Marcador de Saldo Global */
        .marcador-saldo {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 25px;
        }

        /* Pestañas de Navegación */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-button {
            background: #25143a;
            border: 1px solid #4a2d6d;
            color: #bbb;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab-button.active {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 15px #00c6ff;
            border-color: #00c6ff;
        }

        /* Contenedores de cada Juego */
        .game-panel {
            display: none;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(20, 5, 35, 0.85);
            border: 2px solid #3d1b63;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .game-panel.active {
            display: block;
        }

        /* --- ESTILOS DE MAQUINITA (SLOTS) --- */
        .slot-container {
            border: 3px solid #ff0055;
            box-shadow: inset 0 0 20px rgba(255,0,85,0.5), 0 0 15px rgba(255,0,85,0.3);
            border-radius: 15px;
            padding: 20px;
            background: #090111;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .slot {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- ESTILOS DE LA RULETA --- */
        .wheel-box {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 25px auto;
        }
        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0055;
            z-index: 10;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            background: conic-gradient(
                #ff3366 0deg 60deg,
                #33cc66 60deg 120deg,
                #3366ff 120deg 180deg,
                #ffcc33 180deg 240deg,
                #ff9933 240deg 300deg,
                #9933ff 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* --- ESTILOS DE MINAS --- */
        .grid-minas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }
        .mine-tile {
            aspect-ratio: 1;
            background: #2a163d;
            border: 2px solid #4a2b6d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mine-tile:hover {
            background: #391e54;
            border-color: #00ffcc;
        }
        .mine-tile.revealed {
            background: #11051c;
            border-color: #222;
            cursor: default;
        }

        /* Botones de Acción Generales */
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #ff0055 0%, #d6004b 100%);
            border: none;
            color: white;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: all 0.2s;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .btn-spin {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
            color: #000;
        }
        .btn-safe {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }

        /* Panel de Estado / Mensajes */
        .status-msg {
            margin-top: 15px;
            font-size: 15px;
            min-height: 20px;
            color: #ffcc00;
        }

        /* Cajero (Depositar / Retirar) */
        .cajero-box {
            margin-top: 25px;
            border-top: 1px solid #2d1744;
            padding-top: 20px;
            display: flex;
            gap: 15px;
        }
        .btn-cajero {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-deposit { background: #28a745; color: white; }
        .btn-withdraw { background: #dc3545; color: white; }
    </style>
</head>
<body>

    <h1>CASINO PREMIUM</h1>

    <div class="marcador-saldo">SALDO: $<span id="displaySaldo">10.00</span></div>

    <div class="tabs">
        <button class="tab-button active" onclick="cambiarJuego('slots')">🎰 Maquinita</button>
        <button class="tab-button" onclick="cambiarJuego('ruleta')">🎡 Ruleta</button>
        <button class="tab-button" onclick="cambiarJuego('minas')">💣 Minas</button>
    </div>

    <div id="panel-slots" class="game-panel active">
        <div class="slot-container">
            <div class="row">
                <div id="slot1" class="slot">🍒</div>
                <div id="slot2" class="slot">👑</div>
                <div id="slot3" class="slot">💎</div>
            </div>
        </div>
        <button id="btnApostarSlots" class="btn-action">APRESTAR ($1)</button>
        <div id="mensajeSlots" class="status-msg">¡Prueba tu suerte en los slots!</div>
    </div>

    <div id="panel-ruleta" class="game-panel">
        <div class="wheel-box">
            <div class="pointer"></div>
            <div id="wheel" class="wheel"></div>
        </div>
        <button id="btnGirarRuleta" class="btn-action btn-spin">GIRAR RULETA ($1)</button>
        <div id="mensajeRuleta" class="status-msg">¡Prueba tu suerte!</div>
    </div>

    <div id="panel-minas" class="game-panel">
        <div id="tablero" class="grid-minas"></div>
        <button id="btnIniciarMinas" class="btn-action">INICIAR JUEGO ($1)</button>
        <button id="btnRetirarMinas" class="btn-action btn-safe" style="display:none;">RETIRAR GANANCIAS</button>
        <div id="mensajeMinas" class="status-msg">Configuración: 3 Minas ocultas.</div>
    </div>

    <div style="max-width:400px; margin:0 auto;">
        <div class="cajero-box">
            <button class="btn-cajero btn-deposit" onclick="depositarSimulado()">💰 DEPOSITAR</button>
            <button class="btn-cajero btn-withdraw" onclick="retirarSimulado()">💵 RETIRAR</button>
        </div>
    </div>

    <script>
        // --- LOGICA GLOBAL Y SALDO ---
        let saldoActual = 10.00;
        const displaySaldo = document.getElementById('displaySaldo');

        // Efectos de sonido simulados (evitan fallos si no hay archivos cargados)
        const sndClick = { play: function(){}, currentTime: 0 };
        const sndPremio = { play: function(){}, currentTime: 0 };
        const sndBomba = { play: function(){}, currentTime: 0 };

        function cambiarJuego(juego) {
            document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            if(juego === 'slots') {
                document.getElementById('panel-slots').classList.add('active');
                event.target.classList.add('active');
            } else if(juego === 'ruleta') {
                document.getElementById('panel-ruleta').classList.add('active');
                event.target.classList.add('active');
            } else if(juego === 'minas') {
                document.getElementById('panel-minas').classList.add('active');
                event.target.classList.add('active');
                crearTableroInicial();
            }
        }

        function depositarSimulado() {
            saldoActual += 10.00;
            displaySaldo.textContent = saldoActual.toFixed(2);
        }

        function retirarSimulado() {
            if(saldoActual > 0) {
                alert(`Sistema Automático: Aquí está su dinero. Se cobraron $${saldoActual.toFixed(2)} inmediatamente.`);
                saldoActual = 0;
                displaySaldo.textContent = saldoActual.toFixed(2);
            }
        }

        // --- LÓGICA DE MAQUINITA ---
        const iconos = ['🍒', '🍋', '🍉', '💎', '👑', '⭐'];
        const btnApostarSlots = document.getElementById('btnApostarSlots');
        const mensajeSlots = document.getElementById('mensajeSlots');

        btnApostarSlots.addEventListener('click', () => {
            if (saldoActual < 1.00) { mensajeSlots.textContent = "❌ Saldo insuficiente."; return; }
            
            saldoActual -= 1.00;
            displaySaldo.textContent = saldoActual.toFixed(2);
            mensajeSlots.textContent = "🎰 Girando...";

            let s1 = document.getElementById('slot1');
            let s2 = document.getElementById('slot2');
            let s3 = document.getElementById('slot3');

            let cambios = 0;
            let intervalo = setInterval(() => {
                s1.textContent = iconos[Math.floor(Math.random() * iconos.length)];
                s2.textContent = iconos[Math.floor(Math.random() * iconos.length)];
                s3.textContent = iconos[Math.floor(Math.random() * iconos.length)];
                cambios++;

                if (cambios > 10) {
                    clearInterval(intervalo);
                    evaluarResultadoSlots(s1.textContent, s2.textContent, s3.textContent);
                }
            }, 100);
        });

        function evaluarResultadoSlots(a, b, c) {
            if (a === b && b === c) {
                let premio = 5.00;
                if(a === '💎' || a === '👑') premio = 10.00;
                saldoActual += premio;
                mensajeSlots.textContent = `🎉 ¡TRIPLE! Ganaste $${premio.toFixed(2)}`;
            } else if (a === b || b === c || a === c) {
                saldoActual += 1.50;
                mensajeSlots.textContent = "✨ ¡Doble! Recuperas y ganas $1.50";
            } else {
                mensajeSlots.textContent = "❌ Suerte para la próxima.";
            }
            displaySaldo.textContent = saldoActual.toFixed(2);
        }

        // --- LÓGICA DE LA RULETA ---
        const wheel = document.getElementById('wheel');
        const btnGirarRuleta = document.getElementById('btnGirarRuleta');
        const mensajeRuleta = document.getElementById('mensajeRuleta');
        let gradosActuales = 0;

        btnGirarRuleta.addEventListener('click', () => {
            if (saldoActual < 1.00) { mensajeRuleta.textContent = "❌ Saldo insuficiente."; return; }
            
            saldoActual -= 1.00;
            displaySaldo.textContent = saldoActual.toFixed(2);
            mensajeRuleta.textContent = "🎡 La ruleta está girando...";

            const vueltas Extra = Math.floor(Math.random() * 360) + 1440; 
            gradosActuales += vueltasExtra;
            wheel.style.transform = `rotate(${gradosActuales}deg)`;

            setTimeout(() => {
                const anguloFinal = (gradosActuales % 360);
                // Dividido en 6 sectores de 60 grados cada uno
                if (anguloFinal >= 0 && anguloFinal < 60) {
                    saldoActual += 2.00;
                    mensajeRuleta.textContent = "💰 ¡Multiplicador x2! Ganaste $2.00";
                } else if (anguloFinal >= 60 && anguloFinal < 120) {
                    mensajeRuleta.textContent = "💀 ¡Mala suerte! Sector vacío (x0)";
                } else if (anguloFinal >= 120 && anguloFinal < 180) {
                    saldoActual += 1.50;
                    mensajeRuleta.textContent = "💵 ¡Premio menor! Ganaste $1.50";
                } else if (anguloFinal >= 180 && anguloFinal < 240) {
                    saldoActual += 0.50;
                    mensajeRuleta.textContent = "✨ ¡Devolución parcial! Recibes $0.50";
                } else if (anguloFinal >= 240 && anguloFinal < 300) {
                    saldoActual += 5.00;
                    mensajeRuleta.textContent = "🚀 ¡PREMIO MAYOR! Ganaste $5.00";
                } else {
                    saldoActual += 1.00;
                    mensajeRuleta.textContent = "👍 ¡Empate! Recuperas tu $1.00";
                }
                displaySaldo.textContent = saldoActual.toFixed(2);
            }, 4000);
        });

        // --- LÓGICA DE MINAS ---
        const tablero = document.getElementById('tablero');
        const btnIniciarMinas = document.getElementById('btnIniciarMinas');
        const btnRetirarMinas = document.getElementById('btnRetirarMinas');
        const mensajeMinas = document.getElementById('mensajeMinas');
        let minasMapa = [];
        let juegoMinasActivo = false;
        let diamantesEncontrados = 0;
        let pozoMinas = 0;

        function crearTableroInicial() {
            tablero.innerHTML = '';
            for(let i=0; i<16; i++) {
                const tile = document.createElement('div');
                tile.classList.add('mine-tile');
                tablero.appendChild(tile);
            }
        }

        function crearTablero() {
            tablero.innerHTML = '';
            for(let i=0; i<16; i++) {
                const tile = document.createElement('div');
                tile.classList.add('mine-tile');
                tile.dataset.index = i;
                tile.addEventListener('click', tocarCasilla);
                tablero.appendChild(tile);
            }
        }

        btnIniciarMinas.addEventListener('click', () => {
            if (juegoMinasActivo) return;
            if (saldoActual < 1.00) { mensajeMinas.textContent = "❌ Saldo insuficiente."; return; }
            
            saldoActual -= 1.00; 
            displaySaldo.textContent = saldoActual.toFixed(2);
            
            juegoMinasActivo = true;
            diamantesEncontrados = 0;
            pozoMinas = 1.00;
            mensajeMinas.textContent = "💎 ¡Juego Iniciado! Pozo actual: $1.00";
            btnIniciarMinas.style.display = 'none';
            btnRetirarMinas.style.display = 'block';
            
            minasMapa = Array(16).fill('💎');
            let colocadas = 0;
            while(colocadas < 3) {
                let idx = Math.floor(Math.random() * 16);
                if(minasMapa[idx] === '💎') { 
                    minasMapa[idx] = '💣'; 
                    colocadas++; 
                }
            }
            crearTablero();
        });

        function tocarCasilla(e) {
            if (!juegoMinasActivo) return;
            const tile = e.target;
            if (tile.classList.contains('revealed')) return;

            tile.classList.add('revealed');
            const idx = tile.dataset.index;
            tile.textContent = minasMapa[idx];

            if (minasMapa[idx] === '💣') {
                juegoMinasActivo = false;
                mensajeMinas.textContent = "💥 ¡BOOM! Tocaste una mina. Perdiste.";
                btnIniciarMinas.style.display = 'block';
                btnRetirarMinas.style.display = 'none';
                revelarTodo();
            } else {
                diamantesEncontrados++;
                pozoMinas += 0.40;
                mensajeMinas.textContent = `💎 ¡Diamante! Pozo actual: $${pozoMinas.toFixed(2)}`;
                if(diamantesEncontrados === 13) cobrarMinas();
            }
        }

        btnRetirarMinas.addEventListener('click', cobrarMinas);

        function cobrarMinas() {
            if(!juegoMinasActivo) return;
            juegoMinasActivo = false;
            saldoActual += pozoMinas;
            displaySaldo.textContent = saldoActual.toFixed(2);
            mensajeMinas.textContent = `💰 ¡Cobraste con éxito! Ganaste $${pozoMinas.toFixed(2)}`;
            btnIniciarMinas.style.display = 'block';
            btnRetirarMinas.style.display = 'none';
            revelarTodo();
        }

        function revelarTodo() {
            const tiles = document.querySelectorAll('.mine-tile');
            tiles.forEach(tile => {
                const idx = tile.dataset.index;
                tile.classList.add('revealed');
                tile.textContent = minasMapa[idx];
            });
        }
    </script>
</body>
</html>
